[package]
name = "lab-server"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["arbitrary_precision"] }
serialport = "4.10.1"
toml = { version = "1.2.0", default-features = false, features = ["std", "serde", "parse"] }
