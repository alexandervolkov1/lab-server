[package]
name = "lab-server"
version = "0.1.0"
edition = "2024"

[features]
gate-metrics = []

[[example]]
name = "service_gate_bench"
required-features = ["gate-metrics"]

[dependencies]
ctrlc = "3.5.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["arbitrary_precision", "raw_value"] }
serialport = "4.10.1"
tempfile = "3.27.0"
thermal-plant-model = { git = "https://github.com/alexandervolkov1/thermal-plant-model", rev = "c53a21fcd682639f51f607563757685535c6797a" }
toml = { version = "1.2.0", default-features = false, features = ["std", "serde", "parse", "display"] }
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
