# Architecture example only: custom_ascii is NOT implemented.
# Startup with this file fails with an unknown-driver configuration error.
# Use examples/arduino.toml or configure examples/metakon-readonly.toml for hardware.

[tcp]
bind = "127.0.0.1:7240"

[[ports]]
id = "arduino_link"
name = "COM3"
baud = 57600
data_bits = 8
parity = "none"
stop_bits = 1
flow_control = "none"
timeout_ms = 3000

[[ports]]
id = "shared_bus"
name = "COM4"
baud = 9600
data_bits = 8
parity = "none"
stop_bits = 1
flow_control = "none"
timeout_ms = 1000

[[devices]]
id = "furnace1"
driver = "arduino"
port = "arduino_link"

# Optional polling overrides by local signal name, in milliseconds.
[devices.poll_periods_ms]
sample_temperature = 1000
power = 2000

[[devices]]
id = "gauge1"
driver = "metakon"
port = "shared_bus"

[devices.options]
address = 1
channel = 0
process_value_scale = 1.0 # Illustrative raw counts, not a verified engineering scale.
write_enabled = false

[[devices]]
id = "controller1"
driver = "custom_ascii" # Another demonstration driver on the same physical port.
port = "shared_bus"

[devices.options]
address = 2
